name: Build LineageOS 23 - Galaxy J3 2017 Ultimate

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'userdebug'
        type: choice
        options:
          - user
          - userdebug
          - eng
      optimization_level:
        description: 'Optimization level'
        required: true
        default: 'balanced'
        type: choice
        options:
          - maximum
          - balanced
          - battery

env:
  LINEAGE_VERSION: '23.0'
  DEVICE_CODENAME: 'j3y17lte'
  BUILD_TYPE: ${{ github.event.inputs.build_type }}
  CCACHE_SIZE: '50G'
  USE_CCACHE: 1

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Free up disk space
        run: |
          sudo apt-get remove -y '^dotnet-.*' '^llvm-.*' 'php.*' azure-cli
          sudo apt-get autoremove -y
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android
          df -h
          
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3 openjdk-11-jdk repo
            
      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-lineage23-${{ env.DEVICE_CODENAME }}-${{ github.run_id }}
          restore-keys: ccache-lineage23-${{ env.DEVICE_CODENAME }}-
            
      - name: Configure ccache
        run: |
          mkdir -p ~/.ccache
          ccache -M $CCACHE_SIZE
          ccache -z
          
      - name: Configure Git
        run: |
          git config --global user.email "builder@lineageos.org"
          git config --global user.name "LineageOS Builder"
          
      - name: Initialize repo
        run: |
          mkdir -p ~/lineage
          cd ~/lineage
          repo init -u https://github.com/LineageOS/android.git -b lineage-$LINEAGE_VERSION --depth=1
          
      - name: Setup device tree
        run: |
          cd ~/lineage
          mkdir -p device/samsung
          cp -r $GITHUB_WORKSPACE device/samsung/$DEVICE_CODENAME
          
      - name: Sync repositories
        run: |
          cd ~/lineage
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle
          
      - name: Build ROM
        run: |
          cd ~/lineage
          source build/envsetup.sh
          breakfast $DEVICE_CODENAME $BUILD_TYPE
          ccache -s
          mka bacon -j$(nproc --all)
          ccache -s
          
      - name: Prepare ROM
        run: |
          cd ~/lineage/out/target/product/$DEVICE_CODENAME
          ROM_FILE=$(ls lineage-*.zip | head -n 1)
          echo "ROM_FILE=$ROM_FILE" >> $GITHUB_ENV
          cat > ROM_INFO.txt << EOF
          LineageOS 23 - Galaxy J3 2017
          Build: $BUILD_TYPE
          Profile: ${{ github.event.inputs.optimization_level }}
          Date: $(date)
          MD5: $(md5sum $ROM_FILE | cut -d' ' -f1)
          EOF
          
      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS-23-j3y17lte-${{ github.run_number }}
          path: ~/lineage/out/target/product/${{ env.DEVICE_CODENAME }}/lineage-*.zip
          retention-days: 30
