name: Extract Vendor Blobs from Stock ROM

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip unzip git
          pip3 install gdown
      
      - name: Download AP file from Google Drive
        run: |
          echo "Downloading AP file..."
          gdown --fuzzy "https://drive.google.com/file/d/1CifdWZ9Q2lvvINv2qxnlZ8wLic-sDq7q/view?usp=sharing"
          ls -lh
          
      - name: Extract AP file
        run: |
          echo "Extracting AP tar.md5..."
          tar -xf AP_J330FNXXS4CUD3*.tar.md5
          ls -lh
          
      - name: Install Samsung firmware tools
        run: |
          git clone https://github.com/anestisb/android-simg2img.git
          cd android-simg2img
          make
          sudo make install
          cd ..
          
          # Install lz4 for Samsung
          sudo apt-get install -y liblz4-tool
          
      - name: Process images
        run: |
          mkdir -p extracted
          
          # Try to decompress and convert each .lz4 file
          for file in *.img.lz4; do
            if [ -f "$file" ]; then
              echo "Processing $file..."
              base="${file%.lz4}"
              
              # Try lz4 decompression
              lz4 -d "$file" "$base" 2>&1 || {
                echo "Standard lz4 failed, trying unlz4..."
                unlz4 "$file" "$base" 2>&1 || {
                  echo "Decompression failed for $file, skipping..."
                  continue
                }
              }
              
              # Convert sparse to raw if needed
              if [ -f "$base" ]; then
                simg2img "$base" "extracted/${base}" 2>&1 || cp "$base" "extracted/${base}"
              fi
            fi
          done
          
          # Also check for non-lz4 images
          for file in *.img; do
            if [ -f "$file" ] && [[ ! "$file" =~ \.lz4 ]]; then
              echo "Processing $file..."
              simg2img "$file" "extracted/$file" 2>&1 || cp "$file" "extracted/$file"
            fi
          done
          
          ls -lh extracted/
          
      - name: Mount and extract using Python
        run: |
          cat > extract_vendor.py << 'PYTHON_EOF'
          import os
          import subprocess
          import shutil
          
          def run_cmd(cmd):
              print(f"Running: {cmd}")
              result = subprocess.run(cmd, shell=True, capture_output=True, text=True)
              print(result.stdout)
              if result.returncode != 0:
                  print(f"Error: {result.stderr}")
              return result.returncode == 0
          
          # Create directories
          os.makedirs("vendor_blobs/proprietary", exist_ok=True)
          
          # Try to mount system and vendor
          images = []
          for img in os.listdir("extracted"):
              if img.endswith(".img"):
                  images.append(f"extracted/{img}")
          
          print(f"Found images: {images}")
          
          for img_path in images:
              img_name = os.path.basename(img_path).replace(".img", "")
              mount_point = f"mount_{img_name}"
              
              os.makedirs(mount_point, exist_ok=True)
              
              # Try to mount
              if run_cmd(f"sudo mount -o loop,ro {img_path} {mount_point}"):
                  print(f"Mounted {img_path} successfully")
                  
                  # Copy vendor files if this is vendor partition
                  if "vendor" in img_name.lower():
                      run_cmd(f"sudo cp -r {mount_point}/* vendor_blobs/proprietary/ 2>/dev/null || true")
                  
                  # Copy system/vendor if this is system partition
                  if "system" in img_name.lower():
                      vendor_in_system = f"{mount_point}/vendor"
                      if os.path.exists(vendor_in_system):
                          run_cmd(f"sudo cp -r {vendor_in_system}/* vendor_blobs/proprietary/ 2>/dev/null || true")
                  
                  # Unmount
                  run_cmd(f"sudo umount {mount_point}")
              else:
                  print(f"Failed to mount {img_path}")
          
          # Fix permissions
          run_cmd("sudo chown -R $(whoami):$(whoami) vendor_blobs/")
          
          print("Extraction complete!")
          print(f"Vendor blobs size: {subprocess.check_output('du -sh vendor_blobs', shell=True).decode()}")
          PYTHON_EOF
          
          python3 extract_vendor.py
          
      - name: Create vendor makefiles
        run: |
          cd vendor_blobs
          
          cat > j3y17lte-vendor.mk << 'EOF'
          PRODUCT_COPY_FILES += \
              $(call find-copy-subdir-files,*,vendor/samsung/j3y17lte/proprietary,system)
          EOF
          
          cat > BoardConfigVendor.mk << 'EOF'
          # Vendor blobs from stock ROM J330FNXXS4CUD3
          EOF
          
      - name: Package vendor blobs
        run: |
          tar -czf vendor_blobs_j3y17lte.tar.gz vendor_blobs/
          ls -lh vendor_blobs_j3y17lte.tar.gz
          
      - name: Upload vendor blobs
        uses: actions/upload-artifact@v4
        with:
          name: vendor-blobs-j3y17lte
          path: vendor_blobs_j3y17lte.tar.gz
          retention-days: 30
